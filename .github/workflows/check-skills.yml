name: check skills

on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - 'data/**'
      - 'scripts/check_skills.py'
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 scripts/check_skills.py
